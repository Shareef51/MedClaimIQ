apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: medclaimiq-api-bluegreen
spec:
  replicas: 6
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: medclaimiq, app.kubernetes.io/component: api-rollout}
  template:
    metadata:
      labels: {app.kubernetes.io/name: medclaimiq, app.kubernetes.io/component: api-rollout}
    spec:
      containers:
        - name: api
          image: ghcr.io/example/medclaimiq-api@sha256:REPLACE_WITH_SIGNED_DIGEST
          ports: [{containerPort: 8000}]
          readinessProbe: {httpGet: {path: /api/v1/health, port: 8000}, periodSeconds: 10}
  strategy:
    blueGreen:
      activeService: medclaimiq-api-stable
      previewService: medclaimiq-api-preview
      autoPromotionEnabled: false
      previewReplicaCount: 2
      scaleDownDelaySeconds: 300
      prePromotionAnalysis:
        templates: [{templateName: medclaimiq-api-release-slo}]
      postPromotionAnalysis:
        templates: [{templateName: medclaimiq-api-release-slo}]
