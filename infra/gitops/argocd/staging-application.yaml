apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medclaimiq-staging
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: medclaimiq
  source:
    repoURL: https://github.com/REPLACE_ORG/REPLACE_REPO.git
    targetRevision: main
    path: infra/helm/medclaimiq
    helm:
      valueFiles:
        - values-staging.yaml
        - ../../gitops/environments/staging/release-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: medclaimiq-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
