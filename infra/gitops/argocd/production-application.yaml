apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medclaimiq-production
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: medclaimiq
  source:
    repoURL: https://github.com/REPLACE_ORG/REPLACE_REPO.git
    targetRevision: main
    path: infra/helm/medclaimiq
    helm:
      valueFiles:
        - values-production.yaml
        - ../../gitops/environments/production/release-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: medclaimiq-production
  syncPolicy:
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
