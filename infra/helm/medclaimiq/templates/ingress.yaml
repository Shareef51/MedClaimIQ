{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medclaimiq
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: {service: {name: medclaimiq-api, port: {number: 8000}}}
          - path: /mcp
            pathType: Prefix
            backend: {service: {name: medclaimiq-api, port: {number: 8000}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: medclaimiq-frontend, port: {number: 3000}}}
{{- end }}
