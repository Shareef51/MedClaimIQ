{{- if ne .Values.release.strategy "rolling" }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: medclaimiq-api
  labels: {app.kubernetes.io/name: medclaimiq, app.kubernetes.io/component: api}
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    {{ if eq .Values.release.strategy "canary" }}
    canary:
      stableService: medclaimiq-api
      canaryService: medclaimiq-api-canary
      maxUnavailable: 0
      maxSurge: 1
      abortScaleDownDelaySeconds: 30
      steps:
        - setWeight: 10
        - pause: {duration: 2m}
        - analysis:
            templates: [{templateName: medclaimiq-api-release-slo}]
            args: [{name: service-name, value: medclaimiq-api-canary}]
        - setWeight: 25
        - pause: {duration: 3m}
        - analysis:
            templates: [{templateName: medclaimiq-api-release-slo}]
            args: [{name: service-name, value: medclaimiq-api-canary}]
        - setWeight: 50
        - pause: {duration: 5m}
        - analysis:
            templates: [{templateName: medclaimiq-api-release-slo}]
            args: [{name: service-name, value: medclaimiq-api-canary}]
        - setWeight: 100
    {{ else if eq .Values.release.strategy "bluegreen" }}
    blueGreen:
      activeService: medclaimiq-api
      previewService: medclaimiq-api-preview
      autoPromotionEnabled: false
      previewReplicaCount: 2
      scaleDownDelaySeconds: 300
      prePromotionAnalysis:
        templates: [{templateName: medclaimiq-api-release-slo}]
        args: [{name: service-name, value: medclaimiq-api-preview}]
      postPromotionAnalysis:
        templates: [{templateName: medclaimiq-api-release-slo}]
        args: [{name: service-name, value: medclaimiq-api}]
    {{ end }}
  selector:
    matchLabels: {app.kubernetes.io/name: medclaimiq, app.kubernetes.io/component: api}
  template:
    metadata:
      annotations:
        medclaimiq.io/release-id: {{ .Values.release.id | quote }}
        medclaimiq.io/git-sha: {{ .Values.release.gitSha | quote }}
      labels:
        app.kubernetes.io/name: medclaimiq
        app.kubernetes.io/component: api
        {{- with .Values.global.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "medclaimiq.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.global.podSecurityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: medclaimiq, app.kubernetes.io/component: api}}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: {matchLabels: {app.kubernetes.io/name: medclaimiq, app.kubernetes.io/component: api}}
      containers:
        - name: api
          image: {{ include "medclaimiq.image" .Values.images.api | quote }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          securityContext: {{ toYaml .Values.global.containerSecurityContext | nindent 12 }}
          ports: [{name: http, containerPort: {{ .Values.api.port }}}]
          envFrom:
            - configMapRef: {name: medclaimiq-runtime}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.databaseUrlSecretKey }}}}
            - name: REDIS_URL
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.redisUrlSecretKey }}}}
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.kafkaBootstrapSecretKey }}}}
            - name: QDRANT_URL
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.qdrantUrlSecretKey }}}}
            - name: QDRANT_API_KEY
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.qdrantApiKeySecretKey }}, optional: true}}
            - name: S3_BUCKET
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.objectBucketSecretKey }}}}
            - name: S3_SSE_KMS_KEY_ID
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.kmsKeySecretKey }}, optional: true}}
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.openaiApiKeySecretKey }}}}
            - name: COMMUNICATION_DESTINATION_ENCRYPTION_SECRET
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.communicationDestinationSecretKey }}}}
            - name: COMMUNICATION_PROVIDER_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.communicationWebhookSecretKey }}}}
            - name: COMMUNICATION_WORKER_TOKEN
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.communicationWorkerTokenSecretKey }}}}
            - name: FINANCIAL_SETTLEMENT_WEBHOOK_SECRET
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.financialSettlementWebhookSecretKey }}}}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if .Values.secretsStore.enabled }}
            - {name: runtime-secrets, mountPath: /mnt/secrets-store, readOnly: true}
            {{- end }}
          resources: {{ toYaml .Values.api.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /api/v1/health, port: http}, initialDelaySeconds: 5, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3}
          livenessProbe: {httpGet: {path: /api/v1/health, port: http}, initialDelaySeconds: 20, periodSeconds: 20, timeoutSeconds: 3, failureThreshold: 3}
          startupProbe: {httpGet: {path: /api/v1/health, port: http}, periodSeconds: 5, failureThreshold: 30}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 256Mi}}
        {{- if .Values.secretsStore.enabled }}
        - name: runtime-secrets
          csi: {driver: secrets-store.csi.k8s.io, readOnly: true, volumeAttributes: {secretProviderClass: {{ .Values.secretsStore.secretProviderClassName | quote }}}}
        {{- end }}

{{- end }}
