{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-schema-migration"
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  ttlSecondsAfterFinished: 600
  template:
    metadata: {labels: {app.kubernetes.io/name: medclaimiq, app.kubernetes.io/component: migration}}
    spec:
      restartPolicy: Never
      serviceAccountName: {{ include "medclaimiq.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext: {{ toYaml .Values.global.podSecurityContext | nindent 8 }}
      containers:
        - name: alembic
          image: {{ include "medclaimiq.image" .Values.images.api | quote }}
          command: ["alembic","upgrade","head"]
          securityContext: {{ toYaml .Values.global.containerSecurityContext | nindent 12 }}
          env:
            - name: DATABASE_URL
              valueFrom: {secretKeyRef: {name: medclaimiq-runtime-secrets, key: {{ .Values.managedServices.databaseUrlSecretKey }}}}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
      volumes: [{name: tmp, emptyDir: {sizeLimit: 64Mi}}]
{{- end }}
