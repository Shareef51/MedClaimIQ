{{- if .Values.secretsStore.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ .Values.secretsStore.secretProviderClassName }}
spec:
  provider: {{ .Values.secretsStore.provider }}
  parameters:
    {{- if eq .Values.secretsStore.provider "aws" }}
    objects: |
      - objectName: {{ .Values.secretsStore.aws.secretsManagerObjectName | quote }}
        objectType: secretsmanager
        jmesPath:
          - {path: DATABASE_URL, objectAlias: DATABASE_URL}
          - {path: REDIS_URL, objectAlias: REDIS_URL}
          - {path: KAFKA_BOOTSTRAP_SERVERS, objectAlias: KAFKA_BOOTSTRAP_SERVERS}
          - {path: QDRANT_URL, objectAlias: QDRANT_URL}
          - {path: QDRANT_API_KEY, objectAlias: QDRANT_API_KEY}
          - {path: S3_BUCKET, objectAlias: S3_BUCKET}
          - {path: S3_SSE_KMS_KEY_ID, objectAlias: S3_SSE_KMS_KEY_ID}
          - {path: OPENAI_API_KEY, objectAlias: OPENAI_API_KEY}
          - {path: AUTH_SESSION_HMAC_SECRET, objectAlias: AUTH_SESSION_HMAC_SECRET}
          - {path: SECURITY_AUDIT_EXPORT_HMAC_SECRET, objectAlias: SECURITY_AUDIT_EXPORT_HMAC_SECRET}
          - {path: FHIR_SUBSCRIPTION_WEBHOOK_SECRET, objectAlias: FHIR_SUBSCRIPTION_WEBHOOK_SECRET}
          - {path: COMMUNICATION_DESTINATION_ENCRYPTION_SECRET, objectAlias: COMMUNICATION_DESTINATION_ENCRYPTION_SECRET}
          - {path: COMMUNICATION_PROVIDER_WEBHOOK_SECRET, objectAlias: COMMUNICATION_PROVIDER_WEBHOOK_SECRET}
          - {path: COMMUNICATION_WORKER_TOKEN, objectAlias: COMMUNICATION_WORKER_TOKEN}
          - {path: FINANCIAL_SETTLEMENT_WEBHOOK_SECRET, objectAlias: FINANCIAL_SETTLEMENT_WEBHOOK_SECRET}
          - {path: MEDCLAIMIQ_OIDC_CLIENT_SECRET, objectAlias: MEDCLAIMIQ_OIDC_CLIENT_SECRET}
          - {path: MEDCLAIMIQ_FRONTEND_SESSION_SECRET, objectAlias: MEDCLAIMIQ_FRONTEND_SESSION_SECRET}
    {{- else if eq .Values.secretsStore.provider "azure" }}
    keyvaultName: {{ .Values.secretsStore.azure.keyVaultName | quote }}
    tenantId: {{ .Values.secretsStore.azure.tenantId | quote }}
    clientID: {{ .Values.secretsStore.azure.clientId | quote }}
    usePodIdentity: "false"
    objects: |
      array:
        - |
          objectName: DATABASE-URL
          objectAlias: DATABASE_URL
          objectType: secret
        - |
          objectName: REDIS-URL
          objectAlias: REDIS_URL
          objectType: secret
        - |
          objectName: KAFKA-BOOTSTRAP-SERVERS
          objectAlias: KAFKA_BOOTSTRAP_SERVERS
          objectType: secret
        - |
          objectName: QDRANT-URL
          objectAlias: QDRANT_URL
          objectType: secret
        - |
          objectName: QDRANT-API-KEY
          objectAlias: QDRANT_API_KEY
          objectType: secret
        - |
          objectName: S3-BUCKET
          objectAlias: S3_BUCKET
          objectType: secret
        - |
          objectName: S3-SSE-KMS-KEY-ID
          objectAlias: S3_SSE_KMS_KEY_ID
          objectType: secret
        - |
          objectName: OPENAI-API-KEY
          objectAlias: OPENAI_API_KEY
          objectType: secret
        - |
          objectName: AUTH-SESSION-HMAC-SECRET
          objectAlias: AUTH_SESSION_HMAC_SECRET
          objectType: secret
        - |
          objectName: SECURITY-AUDIT-EXPORT-HMAC-SECRET
          objectAlias: SECURITY_AUDIT_EXPORT_HMAC_SECRET
          objectType: secret
        - |
          objectName: FHIR-SUBSCRIPTION-WEBHOOK-SECRET
          objectAlias: FHIR_SUBSCRIPTION_WEBHOOK_SECRET
          objectType: secret
        - |
          objectName: COMMUNICATION-DESTINATION-ENCRYPTION-SECRET
          objectAlias: COMMUNICATION_DESTINATION_ENCRYPTION_SECRET
          objectType: secret
        - |
          objectName: COMMUNICATION-PROVIDER-WEBHOOK-SECRET
          objectAlias: COMMUNICATION_PROVIDER_WEBHOOK_SECRET
          objectType: secret
        - |
          objectName: COMMUNICATION-WORKER-TOKEN
          objectAlias: COMMUNICATION_WORKER_TOKEN
          objectType: secret
        - |
          objectName: FINANCIAL-SETTLEMENT-WEBHOOK-SECRET
          objectAlias: FINANCIAL_SETTLEMENT_WEBHOOK_SECRET
          objectType: secret
        - |
          objectName: MEDCLAIMIQ-OIDC-CLIENT-SECRET
          objectAlias: MEDCLAIMIQ_OIDC_CLIENT_SECRET
          objectType: secret
        - |
          objectName: MEDCLAIMIQ-FRONTEND-SESSION-SECRET
          objectAlias: MEDCLAIMIQ_FRONTEND_SESSION_SECRET
          objectType: secret
    {{- end }}
  secretObjects:
    - secretName: medclaimiq-runtime-secrets
      type: Opaque
      data:
        - {objectName: DATABASE_URL, key: DATABASE_URL}
        - {objectName: REDIS_URL, key: REDIS_URL}
        - {objectName: KAFKA_BOOTSTRAP_SERVERS, key: KAFKA_BOOTSTRAP_SERVERS}
        - {objectName: QDRANT_URL, key: QDRANT_URL}
        - {objectName: QDRANT_API_KEY, key: QDRANT_API_KEY}
        - {objectName: S3_BUCKET, key: S3_BUCKET}
        - {objectName: S3_SSE_KMS_KEY_ID, key: S3_SSE_KMS_KEY_ID}
        - {objectName: OPENAI_API_KEY, key: OPENAI_API_KEY}
        - {objectName: AUTH_SESSION_HMAC_SECRET, key: AUTH_SESSION_HMAC_SECRET}
        - {objectName: SECURITY_AUDIT_EXPORT_HMAC_SECRET, key: SECURITY_AUDIT_EXPORT_HMAC_SECRET}
        - {objectName: FHIR_SUBSCRIPTION_WEBHOOK_SECRET, key: FHIR_SUBSCRIPTION_WEBHOOK_SECRET}
        - {objectName: COMMUNICATION_DESTINATION_ENCRYPTION_SECRET, key: COMMUNICATION_DESTINATION_ENCRYPTION_SECRET}
        - {objectName: COMMUNICATION_PROVIDER_WEBHOOK_SECRET, key: COMMUNICATION_PROVIDER_WEBHOOK_SECRET}
        - {objectName: COMMUNICATION_WORKER_TOKEN, key: COMMUNICATION_WORKER_TOKEN}
        - {objectName: FINANCIAL_SETTLEMENT_WEBHOOK_SECRET, key: FINANCIAL_SETTLEMENT_WEBHOOK_SECRET}
    - secretName: medclaimiq-frontend-secrets
      type: Opaque
      data:
        - {objectName: MEDCLAIMIQ_OIDC_CLIENT_SECRET, key: MEDCLAIMIQ_OIDC_CLIENT_SECRET}
        - {objectName: MEDCLAIMIQ_FRONTEND_SESSION_SECRET, key: MEDCLAIMIQ_FRONTEND_SESSION_SECRET}
{{- end }}
