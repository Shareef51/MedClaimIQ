[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medclaimiq-api"
version = "0.1.0"
description = "MedClaimIQ production API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.13,<2.0",
  "structlog>=24.4,<26.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "boto3>=1.35,<2.0",
  "openai>=1.100,<3.0",
  "qdrant-client>=1.15,<2.0",
  "redis>=5.2,<7.0",
  "langgraph>=1.2.10,<2.0",
  "langgraph-checkpoint-postgres>=3.1,<4.0",
  "aiokafka>=0.14,<1.0",
  "PyMuPDF>=1.24,<2.0",
  "opentelemetry-api>=1.44,<2.0",
  "opentelemetry-sdk>=1.44,<2.0",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<2.0",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<1.0",
]

[project.optional-dependencies]
observability = [
  "langsmith>=0.10.12,<1.0",
  "arize-phoenix-otel>=0.16.1,<1.0",
]
document-intelligence = [
  "PyMuPDF>=1.24,<2.0",
  "Pillow>=10.4,<12.0",
  "pytesseract>=0.3.13,<1.0",
  "docling>=2.0,<3.0",
  "faster-whisper>=1.0,<2.0",
]
dev = [
  "pytest>=8.3,<9.0",
  "ruff>=0.7,<1.0",
  "locust>=2.46,<3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
