policy_id: regulatory-examination-reauthorized-enterprise-remediation-reexecution
version: 1
mode: monitoring_recommendation_only
release103_provenance:
  enterprise_remediation_reauthorization_version_required: true
  human_reauthorization_confirmation_required: true
  human_root_cause_confirmation_reference_required: true
  human_systemic_remediation_failure_classification_reference_required: true
  independent_challenge_reference_required: true
  authorized_decision_required: authorize
human_authority:
  remediation_reexecution_intake_required: true
  root_cause_treatment_owner_confirmation_required: true
  control_retransformation_approval_required: true
  residual_systemic_risk_acceptance_required: true
  recovery_effectiveness_certification_required: true
  regulatory_commitment_closure_required: true
  recovery_program_reclosure_required: true
independent_assurance:
  recovery_effectiveness_assurance_required: true
  segregation_of_duties_required: true
