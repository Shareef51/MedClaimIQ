policy_name: regulatory-examination-commitment-lifecycle
version: 1
mode: production
human_authority:
  binding_commitment_creation: prohibited_for_ai
  completion_certification: authorized_human_only
  commitment_amendment_approval: authorized_human_only
  regulatory_obligation_change: prohibited_for_ai
monitoring:
  due_soon_days: 14
  overdue_escalation: true
  cross_examination_correlation: recommendation_only
completion_gates:
  require_all_milestones_complete: true
  require_evidence_provenance: true
  require_effectiveness_validation: true
  require_human_certification: true
  automated_certification: false
safety:
  accounting_mutation: false
  payment_authority: false
  autonomous_regulator_communication: false
