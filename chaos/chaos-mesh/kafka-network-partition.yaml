apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: medclaimiq-kafka-network-partition
  namespace: medclaimiq-staging
spec:
  action: partition
  mode: all
  duration: 120s
  selector:
    namespaces: [medclaimiq-staging]
    labelSelectors:
      app.kubernetes.io/part-of: medclaimiq
  direction: to
  externalTargets: [kafka.staging.internal]
